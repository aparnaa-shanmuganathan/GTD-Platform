# Test profile.
#
# Datasource connection properties are NOT set here - they are registered at
# runtime by com.gtd.platform.testsupport.PostgresIntegrationTestBase via
# @DynamicPropertySource, pointing at either a Testcontainers PostgreSQL 16
# container (if Docker is available) or an io.zonky.test embedded-postgres
# instance (Docker-free fallback) - see that class for the selection logic.
spring:
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.gtd.platform: INFO
    org.testcontainers: INFO

# Overrides application.yml's default (the OS user's real home directory) with a disposable
# temp location, so running the test suite never writes real report files under a developer's
# actual home directory.
gtd:
  reports:
    directory: ${java.io.tmpdir}/gtd-platform-test-reports
