<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<title>GTD Analytical Platform</title>
<link rel="stylesheet" th:href="@{/css/gtd-theme.css}">
<script>
  (function() {
    var saved = localStorage.getItem('gtd-theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
</head>
<body>
<div class="home-shell">
  <div class="home-card">
    <div class="panel home-panel">
      <div class="auth-topline">
        <div class="brand">
          <div class="brand-mark"></div>
          <div class="brand-text">
            <span class="brand-title">GTD PLATFORM</span>
            <span class="brand-sub">ANALYTICAL &amp; DECISION SUPPORT</span>
          </div>
        </div>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle dark/light theme">&#9789;</button>
      </div>

      <p th:if="${username != null}" class="field-hint">Signed in as <span class="home-username" th:text="${username}">admin</span>.</p>
      <p th:unless="${username != null}" class="field-hint">Every workspace is open to browse. Signing in as admin is only needed to import data or change configuration.</p>

      <a th:href="@{/workspace/executive}" class="btn btn-primary btn-block" style="margin-top:18px;">Open Workspace</a>

      <a th:unless="${username != null}" th:href="@{/login}" class="btn btn-block" style="margin-top:10px;">Use as Admin</a>
      <form th:if="${username != null}" method="post" th:action="@{/logout}" style="margin-top:10px;">
        <button type="submit" class="btn btn-block">Sign out</button>
      </form>

      <div th:replace="~{fragments/searchmodal :: trigger}"></div>

      <div th:replace="~{fragments/footer :: citation}"></div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/searchmodal :: modal}"></div>
<script th:src="@{/js/search.js}"></script>
<script>
  document.getElementById('themeToggle').addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('gtd-theme', next);
  });
</script>
</body>
</html>
