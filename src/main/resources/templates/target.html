<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<title>Target Workspace — GTD Analytical Platform</title>
<link rel="stylesheet" th:href="@{/css/gtd-theme.css}">
<script th:src="@{/js/echarts.min.js}"></script>
<script>
  (function() {
    var saved = localStorage.getItem('gtd-theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
</head>
<body>
<div class="workspace-shell">
  <div class="topbar">
    <div class="brand">
      <a th:href="@{/}" class="icon-btn" aria-label="Home" style="border:none;background:transparent;">&#8962;</a>
      <div class="brand-mark"></div>
      <div class="brand-text">
        <span class="brand-title">GTD PLATFORM</span>
        <span class="brand-sub">ANALYTICAL &amp; DECISION SUPPORT</span>
      </div>
    </div>
    <div class="topbar-right">
      <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle dark/light theme">&#9789;</button>
      <div class="session-chip" th:if="${username != null}">
        <div class="avatar" th:text="${#strings.substring(username,0,1).toUpperCase()}">A</div>
        <span th:text="${username}">admin</span>
      </div>
      <form method="post" th:action="@{/logout}" th:if="${username != null}" style="margin:0;">
        <button type="submit" class="btn btn-sm">Sign out</button>
      </form>
      <a th:unless="${username != null}" th:href="@{/login}" class="btn btn-sm">Admin sign-in</a>
    </div>
  </div>

  <div th:replace="~{fragments/sidebar :: nav('target')}"></div>

  <main class="main">
    <div class="view-header">
      <div>
        <div class="view-eyebrow">ADC-TARGET-001</div>
        <div class="view-title">Target Workspace</div>
      </div>
    </div>

    <div class="filter-bar" id="filterBar">
      <div class="filter-chip">
        <label for="filterDate">Date range</label>
        <select id="filterDate">
          <option value="full" th:text="${minYear != null ? minYear + ' – ' + maxYear + ' (full)' : 'Full range'}">Full range</option>
          <option value="last10">Last 10 years</option>
          <option value="last5">Last 5 years</option>
        </select>
      </div>
      <div class="filter-chip">
        <label for="filterRegion">Region</label>
        <select id="filterRegion">
          <option value="">All regions</option>
          <option th:each="region : ${regions}" th:value="${region.id}" th:text="${region.name}"></option>
        </select>
      </div>
      <div class="filter-chip">
        <label for="filterAttack">Attack type</label>
        <select id="filterAttack">
          <option value="">All types</option>
          <option th:each="attackType : ${attackTypes}" th:value="${attackType.id}" th:text="${attackType.name}"></option>
        </select>
      </div>
    </div>

    <div id="targetKpiZone"></div>

    <div class="panels-row">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Target types by incident count</div>
          <div class="panel-tag">CAC-AN-002 &middot; AWS-UNK-001</div>
        </div>
        <div id="targetTypeRanking"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Incidents by year</div>
          <div class="panel-tag">CAC-AN-003 &middot; SVC-TREND</div>
        </div>
        <div class="chart-wrap" id="trendChartWrap"></div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: citation}"></div>
  </main>
</div>

<div class="toast-stack" id="toastStack" style="position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:80;max-width:340px;"></div>

<script th:inline="javascript">
  /*<![CDATA[*/
  window.INITIAL_DASHBOARD = /*[[${dashboard}]]*/ {};
  window.MIN_YEAR = /*[[${minYear}]]*/ null;
  window.MAX_YEAR = /*[[${maxYear}]]*/ null;
  /*]]>*/
</script>
<script th:src="@{/js/target.js}"></script>
</body>
</html>
