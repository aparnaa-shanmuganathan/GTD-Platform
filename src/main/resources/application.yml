spring:
  application:
    name: gtd-platform

  # Flyway owns schema management; Hibernate must never auto-generate DDL.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # JDBC-backed sessions (no Redis) for offline/air-gapped compatibility.
  # spring_session/spring_session_attributes are created by Flyway
  # (V6__admin_user_and_spring_session.sql, Phase 1), copied verbatim from
  # Spring Session's own schema-postgresql.sql - so Spring Session's built-in
  # initializer stays disabled (initialize-schema: never) to avoid a second,
  # conflicting attempt to create the same tables. The cleanup cron, disabled
  # in Phase 0 because the table didn't exist yet, is back to Spring Boot's
  # default cadence now that it does.
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

  # IMPORT service (Phase 3): the real GTD CSV is ~155MB. Limits sized with
  # headroom above that; file-size-threshold=0 forces every upload straight
  # to a temp file on disk rather than buffering in heap.
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB
      file-size-threshold: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# REPORT service (Phase 6): where generated PDF/CSV report files are written and read back
# from for download. Under the OS user's home directory by default (never a temp directory -
# generated_report rows are immutable and permanent, so the files they point at must be too);
# the test profile overrides this to a disposable temp directory (application-test.yml).
#
# Geospatial Workspace (Phase 9, Part B): offline map tiles remain a genuine, undelivered
# deployment prerequisite (CLAUDE.md section 13, open item 5) - not faked or hardcoded to a
# public tile server (zero-outbound-requests, section 1). tile-url-template defaults to the
# vendored local placeholder grid tile (every {x}/{y}/{z} request resolves to the same file);
# swapping in a real MBTiles-derived tile server later is this one property changing, not a
# code change.
#
# Choropleth boundary polygons (user-directed reversal, post-Phase 9): boundary-geojson-path
# now defaults to the vendored Natural Earth 1:110m admin-0 countries file (public domain, no
# attribution required - static/geo/world-countries.geojson), so boundariesAvailable is true
# out of the box in this environment. An admin can still point this at either another
# classpath-relative static path (leading "/") or an arbitrary absolute filesystem path (e.g.
# a richer 1:50m file) without a rebuild - see GeospatialQueryService.boundariesAvailable().
# boundary-name-property is a comma-separated list of Natural Earth feature properties tried,
# in order, when matching a polygon to a dim_country.name - there is no ISO-code column to
# join on more robustly (a known, disclosed best-effort limitation covering historical/defunct
# GTD-coded political entities with no modern polygon, and a handful of micro-states/
# territories the 1:110m simplification omits entirely). See CLAUDE.md's "Phase 9 decisions,
# Part B" and its choropleth-boundary-reversal addendum for the full rationale.
gtd:
  reports:
    directory: ${user.home}/.gtd-platform/reports
  geospatial:
    tile-url-template: /img/map-placeholder-tile.png
    boundary-geojson-path: /geo/world-countries.geojson
    boundary-name-property: NAME,ADMIN,NAME_LONG,NAME_EN,SOVEREIGNT,FORMAL_EN,BRK_NAME

# No active profile by default - one of "local" or "test" must be selected explicitly.
